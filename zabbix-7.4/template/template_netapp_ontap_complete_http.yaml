    - uuid: dedd9c9c71bb45259b2db17691c2718e
      name: Cluster status
      type: DEPENDENT
      key: netapp.cluster.status
      value_type: CHAR
      description: 'The status of the cluster: ok, error, partial_no_data, partial_no_response,
        partial_other_error, negative_delta, backfilled_data, inconsistent_delta_time,
        inconsistent_old_data.'
      preprocessing:
      - type: JSONPATH
        parameters:
        - "$.statistics.status"
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 6h
      master_item:
        key: netapp.cluster.get
      tags:
      - tag: component
        value: cluster
      triggers:
      - uuid: f9a6fc8b10604356aca833af1932428a
        expression: (last(/NetApp ONTAP Complete by HTTP/netapp.cluster.status)<>"ok")
        name: 'NetApp ONTAP: Cluster status is abnormal'
        priority: AVERAGE
        description: Any errors associated with the sample. For example, if the aggregation
          of data over multiple nodes fails then any of the partial errors might be
          returned, “ok” on success, or “error” on any internal uncategorized failure.
          Whenever a sample collection is missed but done at a later time, it is back
          filled to the previous 15 second timestamp and tagged with "backfilled_data".
          “Inconsistent_ delta_time” is encountered when the time between two collections
          is not the same for all nodes. Therefore, the aggregated value might be
          over or under inflated. “Negative_delta” is returned when an expected monotonically
          increasing value has decreased in value. “Inconsistent_old_data” is returned
          when one or more nodes do not have the latest data.
        tags:
        - tag: scope
          value: availability
        - tag: scope
          value: performance
        event_name: 'NetApp ONTAP: Cluster status is abnormal | valor no disparo:
          {ITEM.VALUE1}'
        opdata: 'Valor atual: {ITEM.LASTVALUE1}'
    - uuid: bffcfc04ab474695b7e3c726c21be539
      name: Cluster software version
      type: DEPENDENT
      key: netapp.cluster.version
      value_type: CHAR
      description: This returns the cluster version information. When the cluster
        has more than one node, the cluster version is equivalent to the lowest of
        generation, major, and minor versions on all nodes.
      preprocessing:
      - type: JSONPATH
        parameters:
        - "$.version.full"
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 6h
      master_item:
        key: netapp.cluster.get
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 19a1cbd278ed44c192c8fb4e8aec0ab9
        expression: last(/NetApp ONTAP Complete by HTTP/netapp.cluster.version,#1)<>last(/NetApp
          ONTAP Complete by HTTP/netapp.cluster.version,#2) and length(last(/NetApp
          ONTAP Complete by HTTP/netapp.cluster.version))>0
        name: 'NetApp ONTAP: Version has changed'
        event_name: 'NetApp ONTAP: Version has changed (new version: {ITEM.VALUE})'
        priority: INFO
        description: The NetApp ONTAP version has changed. Acknowledge to close the
          problem manually.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
        opdata: 'Valor atual: {ITEM.LASTVALUE1}'
    - uuid: a6554bb3cabc40c68f062b56da6a7a43
      name: Get disks
      type: HTTP_AGENT
      key: netapp.disks.get
      history: '0'
      value_type: TEXT
      authtype: BASIC
      username: "{$NETAPP.USERNAME}"
      password: "{$NETAPP.PASSWORD}"
      timeout: "{$NETAPP.HTTP.AGENT.TIMEOUT}"
      url: "{$NETAPP.URL}/api/storage/disks?fields=name,uid,node.name,state,container_type,model,serial_number,firmware_version,usable_size,physical_size,rated_life_used_percent,outage.persistently_failed,outage.reason.message,error.reason.message,bay,location&max_records={$NETAPP.API.MAX.RECORDS}"
      tags:
      - tag: component
        value: raw
    - uuid: a8831be46a0b499c9da6c69b9bb1532f
      name: Get FRUs
      type: HTTP_AGENT
      key: netapp.frus.get
      history: '0'
      value_type: TEXT
      authtype: BASIC
      username: "{$NETAPP.USERNAME}"
      password: "{$NETAPP.PASSWORD}"
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value);
          var records = data.records || [];
          var result = [];
          for (var i = 0; i < records.length; i++) {
            var chassis = records[i];
            var frus = chassis.frus || [];
            for (var j = 0; j < frus.length; j++) {
              var fru = frus[j];
              fru.chassisId = chassis.id;
              result.push(fru);
            }
          }
          return JSON.stringify(result);
      timeout: "{$NETAPP.HTTP.AGENT.TIMEOUT}"
      url: "{$NETAPP.URL}/api/cluster/chassis?fields=id,frus.id,frus.state,frus.type&max_records={$NETAPP.API.MAX.RECORDS}"
      tags:
      - tag: component
        value: raw
    - uuid: c1069f9f6b4a4ec384573af0ef44005d
      name: Get LUNs
