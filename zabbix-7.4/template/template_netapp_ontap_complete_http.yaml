      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value);
          var records = data.records || [];
          var result = [];
          for (var i = 0; i < records.length; i++) {
            var r = records[i];
            var row = {};
            row["{#SHELFUID}"] = String(r.uid);
              row["{#SHELFNAME}"] = (r.name || r.id || String(r.uid));
              row["{#SHELFMODEL}"] = (r.model || "");
            result.push(row);
          }
          return JSON.stringify(result);
