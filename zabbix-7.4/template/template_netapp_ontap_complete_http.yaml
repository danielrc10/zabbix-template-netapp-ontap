          value: disk
        - tag: shelf
          value: "{#SHELFNAME}"
      - uuid: 2be5f61c3c0a488aa36761924c4bb2ef
        name: 'Shelf {#SHELFNAME}: Error count'
        type: DEPENDENT
        key: netapp.shelf.error.count[{#SHELFUID}]
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var data = JSON.parse(value);
            var records = data.records || [];
            for (var i = 0; i < records.length; i++) {
              var r = records[i];
              if (String(r.uid) === "{#SHELFUID}") {
                var result = (r.errors || []).length;
                return (result === undefined || result === null) ? 0 : result;
              }
            }
            return 0;
        master_item:
          key: netapp.shelves.get
        tags:
        - tag: component
          value: shelf
        - tag: shelf
          value: "{#SHELFNAME}"
        trigger_prototypes:
        - uuid: 9fe60607bc5b483fa41e666ec438bdf7
