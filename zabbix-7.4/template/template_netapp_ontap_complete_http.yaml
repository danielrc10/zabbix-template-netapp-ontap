            {ITEM.VALUE1}; limite: >={$NETAPP.VOLUME.USED.CRIT}%'
          opdata: 'Espaço usado: {ITEM.LASTVALUE1}; limite crítico: {$NETAPP.VOLUME.USED.CRIT}%'
        - uuid: ab9879021004471886346a730c0417c5
          expression: last(/NetApp ONTAP Complete by HTTP/netapp.volume.space_used.percent[{#VOLUMENAME}])>={$NETAPP.VOLUME.USED.WARN}
            and last(/NetApp ONTAP Complete by HTTP/netapp.volume.space_used.percent[{#VOLUMENAME}])<{$NETAPP.VOLUME.USED.CRIT}
          name: 'NetApp ONTAP: Volume {#VOLUMENAME} com pouco espaço'
          priority: AVERAGE
          tags:
