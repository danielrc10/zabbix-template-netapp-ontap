        name: "{#VOLUMENAME}: Volume latency"
        graph_items:
        - color: 199C0D
          item:
            host: NetApp ONTAP Complete by HTTP
            key: netapp.volume.statistics.latency.other[{#VOLUMENAME}]
        - sortorder: '1'
          color: F63100
          item:
            host: NetApp ONTAP Complete by HTTP
            key: netapp.volume.statistics.latency.read[{#VOLUMENAME}]
        - sortorder: '2'
          color: 00611C
          item:
            host: NetApp ONTAP Complete by HTTP
            key: netapp.volume.statistics.latency.write[{#VOLUMENAME}]
        - sortorder: '3'
          color: F7941D
          item:
            host: NetApp ONTAP Complete by HTTP
            key: netapp.volume.statistics.latency.total[{#VOLUMENAME}]
      - uuid: 7fe1d97bfce642dc875425e08b11e5a5
        name: "{#VOLUMENAME}: Volume size"
        graph_items:
        - color: 199C0D
          item:
            host: NetApp ONTAP Complete by HTTP
            key: netapp.volume.space_used[{#VOLUMENAME}]
        - sortorder: '1'
          color: F63100
          item:
            host: NetApp ONTAP Complete by HTTP
            key: netapp.volume.space_available[{#VOLUMENAME}]
      timeout: "{$NETAPP.HTTP.AGENT.TIMEOUT}"
      url: "{$NETAPP.URL}/api/storage/volumes?fields=name,uuid,svm.name,type&max_records={$NETAPP.API.MAX.RECORDS}"
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value);
          var records = data.records || [];
          var result = [];
          for (var i = 0; i < records.length; i++) {
            var r = records[i];
            var row = {};
            row["{#VOLUMENAME}"] = r.name;
              row["{#VOLUMEUUID}"] = r.uuid;
              row["{#SVMNAME}"] = (r.svm ? r.svm.name : "");
              row["{#VOLUMETYPE}"] = r.type;
            result.push(row);
          }
          return JSON.stringify(result);
