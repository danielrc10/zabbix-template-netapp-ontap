            and last(/NetApp ONTAP Complete by HTTP/netapp.port.eth.state[{#NODENAME},{#ETHPORTNAME}])="up"
            and last(/NetApp ONTAP Complete by HTTP/netapp.port.eth.enabled[{#NODENAME},{#ETHPORTNAME}])=1
            and {$NETAPP.ETH.PORT.ALARM:"{#NODENAME}/{#ETHPORTNAME}"}=1
          name: 'NetApp ONTAP: Inconsistência de topologia L2 na porta {#NODENAME}/{#ETHPORTNAME}'
          priority: WARNING
          tags:
          - tag: scope
            value: configuration
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/NetApp ONTAP Complete by HTTP/netapp.port.eth.reachability[{#NODENAME},{#ETHPORTNAME}])="ok"
            or last(/NetApp ONTAP Complete by HTTP/netapp.port.eth.state[{#NODENAME},{#ETHPORTNAME}])<>"up"
            or last(/NetApp ONTAP Complete by HTTP/netapp.port.eth.enabled[{#NODENAME},{#ETHPORTNAME}])=0
            or {$NETAPP.ETH.PORT.ALARM:"{#NODENAME}/{#ETHPORTNAME}"}=0
