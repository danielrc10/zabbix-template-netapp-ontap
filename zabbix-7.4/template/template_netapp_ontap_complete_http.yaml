          expression: last(/NetApp ONTAP Complete by HTTP/netapp.port.eth.state[{#NODENAME},{#ETHPORTNAME}])<>"up"
            and last(/NetApp ONTAP Complete by HTTP/netapp.port.eth.enabled[{#NODENAME},{#ETHPORTNAME}])=1
            and {$NETAPP.ETH.PORT.ALARM:"{#NODENAME}/{#ETHPORTNAME}"}=1
          name: 'NetApp ONTAP: Porta Ethernet {#NODENAME}/{#ETHPORTNAME} está inativa'
          priority: HIGH
