        value_type: FLOAT
        params: 100 * last(//netapp.volume.space_used[{#VOLUMENAME}]) / (last(//netapp.volume.space_size[{#VOLUMENAME}])
          + (last(//netapp.volume.space_size[{#VOLUMENAME}])=0))
