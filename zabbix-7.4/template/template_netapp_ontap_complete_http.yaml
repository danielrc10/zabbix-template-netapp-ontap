    - uuid: 1fc6035e8d284d0d863ea94b07b41157
      name: SnapMirror relationships discovery
      type: DEPENDENT
      key: netapp.snapmirror.discovery
      item_prototypes:
      - uuid: 9e128bf12cdd46a8a1b2c72d449e5177
        name: 'SnapMirror {#SMSOURCE} -> {#SMDESTINATION}: Healthy'
        type: DEPENDENT
        key: netapp.snapmirror.healthy[{#SMUUID}]
        preprocessing:
        - type: JSONPATH
          parameters:
          - "$.records[?(@.uuid=='{#SMUUID}')].healthy.first()"
        - type: JAVASCRIPT
          parameters:
          - 'return (value === ''true'' || value === ''1'') ? 1 : 0;'
        master_item:
          key: netapp.snapmirror.get
        tags:
        - tag: component
          value: snapmirror
        - tag: source
          value: "{#SMSOURCE}"
        - tag: destination
          value: "{#SMDESTINATION}"
        trigger_prototypes:
        - uuid: b8ea5368f8784df59974362b24e94485
          expression: last(/NetApp ONTAP Complete by HTTP/netapp.snapmirror.healthy[{#SMUUID}])=0
          name: 'NetApp ONTAP: SnapMirror {#SMSOURCE} -> {#SMDESTINATION} não saudável'
          priority: HIGH
          tags:
          - tag: scope
            value: availability
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/NetApp ONTAP Complete by HTTP/netapp.snapmirror.healthy[{#SMUUID}])=1
          event_name: 'NetApp ONTAP: SnapMirror {#SMSOURCE} -> {#SMDESTINATION} não
            saudável | valor no disparo: {ITEM.VALUE1}'
          opdata: 'Valor atual: {ITEM.LASTVALUE1}'
      - uuid: d8750cc2a40b4279a289a1831292a778
        name: 'SnapMirror {#SMSOURCE} -> {#SMDESTINATION}: State'
        type: DEPENDENT
        key: netapp.snapmirror.state[{#SMUUID}]
        preprocessing:
        - type: JSONPATH
          parameters:
          - "$.records[?(@.uuid=='{#SMUUID}')].state.first()"
        master_item:
          key: netapp.snapmirror.get
        tags:
        - tag: component
          value: snapmirror
        - tag: source
          value: "{#SMSOURCE}"
        - tag: destination
          value: "{#SMDESTINATION}"
        value_type: CHAR
      - uuid: 692cd57d32c94905b4ac3ea1c2aaba0d
        name: 'SnapMirror {#SMSOURCE} -> {#SMDESTINATION}: Lag'
        type: DEPENDENT
        key: netapp.snapmirror.lag.seconds[{#SMUUID}]
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var data = JSON.parse(value);
            var records = data.records || [];
            for (var i = 0; i < records.length; i++) {
              var r = records[i];
              if (r.uuid === "{#SMUUID}") {
                var result = (function () {
              var text = r.lag_time || 'PT0S';
              var m = /^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?)?$/.exec(text);
              if (!m) return null;
              return (parseInt(m[1] || 0,10) * 86400) + (parseInt(m[2] || 0,10) * 3600) + (parseInt(m[3] || 0,10) * 60) + parseFloat(m[4] || 0);
            }());
                return (result === undefined || result === null) ? null : result;
              }
            }
            return null;
        master_item:
          key: netapp.snapmirror.get
        tags:
        - tag: component
          value: snapmirror
        - tag: source
          value: "{#SMSOURCE}"
        - tag: destination
          value: "{#SMDESTINATION}"
        units: s
        trigger_prototypes:
        - uuid: 9023946c096647b192f092e19cc7da10
          expression: last(/NetApp ONTAP Complete by HTTP/netapp.snapmirror.lag.seconds[{#SMUUID}])>{$NETAPP.SNAPMIRROR.LAG.CRIT}
          name: 'NetApp ONTAP: SnapMirror {#SMSOURCE} -> {#SMDESTINATION} com atraso
            alto'
          priority: AVERAGE
          tags:
          - tag: scope
            value: performance
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/NetApp ONTAP Complete by HTTP/netapp.snapmirror.lag.seconds[{#SMUUID}])<{$NETAPP.SNAPMIRROR.LAG.RECOVERY}
          event_name: 'NetApp ONTAP: SnapMirror {#SMSOURCE} -> {#SMDESTINATION} com
            atraso alto | valor no disparo: {ITEM.VALUE1}'
          opdata: 'Valor atual: {ITEM.LASTVALUE1}'
      master_item:
        key: netapp.snapmirror.get
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value);
          var records = data.records || [];
          var result = [];
          for (var i = 0; i < records.length; i++) {
            var r = records[i];
            var row = {};
            row["{#SMUUID}"] = r.uuid;
              row["{#SMSOURCE}"] = ((r.source && r.source.svm ? r.source.svm.name + ":" : "") + (r.source ? r.source.path : ""));
              row["{#SMDESTINATION}"] = ((r.destination && r.destination.svm ? r.destination.svm.name + ":" : "") + (r.destination ? r.destination.path : ""));
            result.push(row);
          }
          return JSON.stringify(result);
