          expression: last(/NetApp ONTAP Complete by HTTP/netapp.volume.space_used.percent[{#VOLUMENAME}])>={$NETAPP.VOLUME.USED.CRIT}
          name: 'NetApp ONTAP: Volume {#VOLUMENAME} crítico de espaço'
          priority: HIGH
          tags:
          - tag: scope
            value: capacity
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/NetApp ONTAP Complete by HTTP/netapp.volume.space_used.percent[{#VOLUMENAME}])<{$NETAPP.VOLUME.USED.RECOVERY}
