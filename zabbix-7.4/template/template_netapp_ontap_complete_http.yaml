    - uuid: 591421afbbf34deeb55c2773a1e44ed5
      name: FRUs discovery
      type: DEPENDENT
      key: netapp.frus.discovery
      item_prototypes:
      - uuid: ded0b99314944144b8ff1c960fdfd8e2
        name: "{#FRUTYPE} {#FRUID}: State"
        type: DEPENDENT
        key: netapp.chassis.fru.state[{#CHASSISID},{#FRUID}]
        value_type: CHAR
        description: 'Estado da FRU: qualquer valor diferente de ok gera alarme.'
        preprocessing:
        - type: JSONPATH
          parameters:
          - "$[?(@.id=='{#FRUID}'&&@.chassisId=='{#CHASSISID}')].state.first()"
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 6h
        master_item:
          key: netapp.frus.get
        tags:
        - tag: chassis
          value: "{#CHASSISID}"
        - tag: component
          value: fru
        - tag: fru
          value: "{#FRUID}"
        - tag: type
          value: "{#FRUTYPE}"
        trigger_prototypes:
        - uuid: 74f83a7ed3434aa3829112cfc311a575
          expression: last(/NetApp ONTAP Complete by HTTP/netapp.chassis.fru.state[{#CHASSISID},{#FRUID}])<>"ok"
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/NetApp ONTAP Complete by HTTP/netapp.chassis.fru.state[{#CHASSISID},{#FRUID}])="ok"
          name: 'NetApp ONTAP: FRU/FONTE {#FRUTYPE} {#FRUID} do chassis {#CHASSISID}
            com falha'
          priority: DISASTER
          description: Something is wrong with the FRU.
          tags:
          - tag: scope
            value: availability
          - tag: scope
            value: performance
          event_name: 'NetApp ONTAP: FRU/FONTE {#FRUTYPE} {#FRUID} do chassis {#CHASSISID}
            com falha | estado: {ITEM.VALUE1}'
          opdata: 'Estado atual: {ITEM.LASTVALUE1}'
      master_item:
        key: netapp.frus.get
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var records = JSON.parse(value) || [];
          var result = [];
          for (var i = 0; i < records.length; i++) {
            var fru = records[i] || {};
            result.push({
              "{#CHASSISID}": fru.chassisId,
              "{#FRUID}": fru.id,
              "{#FRUTYPE}": fru.type || 'fru'
            });
          }
          return JSON.stringify(result);
