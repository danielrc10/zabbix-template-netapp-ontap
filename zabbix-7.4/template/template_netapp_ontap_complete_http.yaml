      - uuid: b17cca8e7ef84f59b4f876373d11acce
        name: 'Quota {#QUOTATYPE} {#QUOTATARGET}: Files soft-limit used'
        type: DEPENDENT
        key: netapp.quota.files.soft_limit.percent[{#QUOTAID}]
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var data = JSON.parse(value);
            var records = data.records || [];
            for (var i = 0; i < records.length; i++) {
              var r = records[i];
              if (String(r.index)==='{#QUOTAINDEX}' && r.volume && String(r.volume.uuid)==='{#VOLUMEUUID}') {
                var result = r.files && r.files.used ? r.files.used.soft_limit_percent : 0;
                return (result === undefined || result === null) ? 0 : result;
              }
            }
            return 0;
        master_item:
          key: netapp.quotas.get
        tags:
        - tag: component
          value: quota
        - tag: quota-type
          value: "{#QUOTATYPE}"
        - tag: quota-target
          value: "{#QUOTATARGET}"
        - tag: quota-scope
          value: "{#QUOTASCOPE}"
        - tag: volume
          value: "{#VOLUMENAME}"
        - tag: svm
          value: "{#SVMNAME}"
        value_type: FLOAT
        units: "%"
        trigger_prototypes:
        - uuid: cf6d97e16bab45e2b87b9e9a75b7f842
          expression: last(/NetApp ONTAP Complete by HTTP/netapp.quota.files.soft_limit.percent[{#QUOTAID}])>=100
            and last(/NetApp ONTAP Complete by HTTP/netapp.quota.files.soft_limit[{#QUOTAID}])>0
            and (last(/NetApp ONTAP Complete by HTTP/netapp.quota.files.hard_limit[{#QUOTAID}])=0
            or last(/NetApp ONTAP Complete by HTTP/netapp.quota.files.hard_limit.percent[{#QUOTAID}])<{$NETAPP.QUOTA.USED.WARN})
          name: 'NetApp ONTAP: Cota soft de arquivos {#QUOTATYPE} {#QUOTATARGET} no
            volume {#VOLUMENAME} (escopo {#QUOTASCOPE}) ultrapassada'
          priority: WARNING
          tags:
          - tag: scope
            value: capacity
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/NetApp ONTAP Complete by HTTP/netapp.quota.files.soft_limit.percent[{#QUOTAID}])<100
            or last(/NetApp ONTAP Complete by HTTP/netapp.quota.files.soft_limit[{#QUOTAID}])=0
            or (last(/NetApp ONTAP Complete by HTTP/netapp.quota.files.hard_limit[{#QUOTAID}])>0
            and last(/NetApp ONTAP Complete by HTTP/netapp.quota.files.hard_limit.percent[{#QUOTAID}])>={$NETAPP.QUOTA.USED.WARN})
          event_name: 'NetApp ONTAP: Cota soft de arquivos {#QUOTATYPE} {#QUOTATARGET}
            no volume {#VOLUMENAME} (escopo {#QUOTASCOPE}) ultrapassada | usado: {ITEM.VALUE1};
            limite soft: {ITEM.VALUE2}'
          opdata: 'Percentual atual do soft limit: {ITEM.LASTVALUE1}; limite soft
            de arquivos: {ITEM.LASTVALUE2}'
      master_item:
        key: netapp.quotas.get
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var data = JSON.parse(value);
          var records = data.records || [];
          var result = [];

          function joinedNames(entries) {
            var names = [];
            entries = entries || [];
            for (var i = 0; i < entries.length; i++) {
              var entry = entries[i] || {};
              names.push(String(entry.name || entry.id || 'unknown'));
            }
            return names.join(', ');
          }

          for (var index = 0; index < records.length; index++) {
            var r = records[index] || {};
            if (!r.volume || !r.volume.uuid || r.index === undefined || r.index === null) continue;
            var type = String(r.type || 'unknown');
            var target = 'unknown';
            if (type === 'user') target = joinedNames(r.users);
            else if (type === 'group') target = r.group ? String(r.group.name || r.group.id || 'unknown') : 'unknown';
            else if (type === 'tree') target = r.qtree ? String(r.qtree.name || r.qtree.id || 'unknown') : 'unknown';
            if (!target) target = 'unknown';
            var qtree = r.qtree && r.qtree.name ? String(r.qtree.name) : 'volume';
            result.push({
              "{#QUOTAID}": String(r.volume.uuid).replace(/-/g, '') + '_' + String(r.index),
              "{#QUOTAINDEX}": String(r.index),
              "{#QUOTATYPE}": type,
              "{#QUOTATARGET}": target,
              "{#QUOTASCOPE}": qtree,
              "{#QTREENAME}": qtree,
              "{#VOLUMEUUID}": String(r.volume.uuid),
              "{#VOLUMENAME}": String(r.volume.name || 'unknown'),
              "{#SVMNAME}": r.svm ? String(r.svm.name || 'unknown') : 'unknown'
            });
          }
          return JSON.stringify(result);
      filter:
        evaltype: AND
        conditions:
        - macro: "{#VOLUMENAME}"
          value: "{$NETAPP.QUOTA.VOLUME.MATCHES}"
          formulaid: A
        - macro: "{#VOLUMENAME}"
          value: "{$NETAPP.QUOTA.VOLUME.NOT_MATCHES}"
          operator: NOT_MATCHES_REGEX
          formulaid: B
        - macro: "{#QUOTATYPE}"
          value: "{$NETAPP.QUOTA.TYPE.MATCHES}"
          formulaid: C
      enabled_lifetime_type: DISABLE_IMMEDIATELY
      lifetime_type: DELETE_AFTER
      lifetime: 1d
