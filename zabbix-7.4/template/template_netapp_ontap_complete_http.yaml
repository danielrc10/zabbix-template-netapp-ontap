      type: HTTP_AGENT
      key: netapp.chassis.get
      history: '0'
      value_type: TEXT
      authtype: BASIC
      username: "{$NETAPP.USERNAME}"
      password: "{$NETAPP.PASSWORD}"
      timeout: "{$NETAPP.HTTP.AGENT.TIMEOUT}"
      url: "{$NETAPP.URL}/api/cluster/chassis?fields=id,state&max_records={$NETAPP.API.MAX.RECORDS}"
      tags:
      - tag: component
        value: raw
    - uuid: 1e34b10b97234853a144da9d5fc3d47a
