      type: HTTP_AGENT
      key: netapp.nodes.discovery
      delay: 1h
      authtype: BASIC
      username: "{$NETAPP.USERNAME}"
      password: "{$NETAPP.PASSWORD}"
      item_prototypes:
      - uuid: d73d20911651476b948a832580664154
        name: "{#NODENAME}: Software version"
        type: DEPENDENT
        key: netapp.node.version[{#NODENAME}]
        value_type: CHAR
        description: This returns the cluster version information. When the cluster
          has more than one node, the cluster version is equivalent to the lowest
          of generation, major, and minor versions on all nodes.
        preprocessing:
        - type: JSONPATH
          parameters:
          - "$.records[?(@.name=='{#NODENAME}')].version.full.first()"
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 6h
        master_item:
          key: netapp.nodes.get
        tags:
        - tag: component
          value: node
        - tag: node
          value: "{#NODENAME}"
        trigger_prototypes:
        - uuid: 759fa0b319d2463191d706ad6c677658
          expression: last(/NetApp ONTAP Complete by HTTP/netapp.node.version[{#NODENAME}],#1)<>last(/NetApp
            ONTAP Complete by HTTP/netapp.node.version[{#NODENAME}],#2) and length(last(/NetApp
            ONTAP Complete by HTTP/netapp.node.version[{#NODENAME}]))>0
          name: 'NetApp ONTAP: {#NODENAME}: Version has changed'
          event_name: 'NetApp ONTAP: {#NODENAME}: Version has changed (new version:
            {ITEM.VALUE})'
          priority: INFO
          description: "{#NODENAME} version has changed. Acknowledge to close the
            problem manually."
          manual_close: 'YES'
          tags:
          - tag: scope
            value: notice
          opdata: 'Valor atual: {ITEM.LASTVALUE1}'
      - uuid: 191008bca5aa493b9753c4c6aa653fa8
        name: "{#NODENAME}: Controller over temperature"
        type: DEPENDENT
        key: netapp.nodes.controller.over_temperature[{#NODENAME}]
        value_type: CHAR
        description: 'Specifies whether the hardware is currently operating outside
          of its recommended temperature range. The hardware shuts down if the temperature
          exceeds critical thresholds. Possible values: over, normal'
        preprocessing:
        - type: JSONPATH
          parameters:
          - "$.records[?(@.name=='{#NODENAME}')].controller.over_temperature.first()"
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 6h
        master_item:
          key: netapp.nodes.get
        tags:
        - tag: component
          value: node
        - tag: node
          value: "{#NODENAME}"
        trigger_prototypes:
        - uuid: 547830e14b8e4e688360d1b52833a697
          expression: (last(/NetApp ONTAP Complete by HTTP/netapp.nodes.controller.over_temperature[{#NODENAME}])<>"normal")
          name: 'NetApp ONTAP: {#NODENAME}: Node has over temperature'
          priority: AVERAGE
          description: The hardware shuts down if the temperature exceeds critical
            thresholds(item's value is "over").
          tags:
          - tag: scope
            value: availability
          - tag: scope
            value: performance
          event_name: 'NetApp ONTAP: {#NODENAME}: Node has over temperature | valor
            no disparo: {ITEM.VALUE1}'
          opdata: 'Valor atual: {ITEM.LASTVALUE1}'
      - uuid: 8f26910365d6484a879027e98b2a4949
        name: "{#NODENAME}: Location"
        type: DEPENDENT
        key: netapp.nodes.location[{#NODENAME}]
        value_type: CHAR
        description: The location of the node.
        preprocessing:
        - type: JSONPATH
          parameters:
          - "$.records[?(@.name=='{#NODENAME}')].location.first()"
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 6h
        master_item:
          key: netapp.nodes.get
        tags:
        - tag: component
          value: node
        - tag: node
          value: "{#NODENAME}"
      - uuid: 28b21360ef7f45f0b8e3e0891d2849e9
        name: "{#NODENAME}: Membership"
        type: DEPENDENT
        key: netapp.nodes.membership[{#NODENAME}]
        value_type: CHAR
        description: |
          Possible values:
            available - If a node is available, this means it is detected on the internal cluster network and can be added to the cluster. Nodes that have a membership of “available” are not returned when a GET request is called when the cluster exists. A query on the “membership” property for available must be provided to scan for nodes on the cluster network. Nodes that have a membership of “available” are returned automatically before a cluster is created.
            joining - Joining nodes are in the process of being added to the cluster. The node may be progressing through the steps to become a member or might have failed. The job to add the node or create the cluster provides details on the current progress of the node.
            member - Nodes that are members have successfully joined the cluster.
        preprocessing:
        - type: JSONPATH
          parameters:
          - "$.records[?(@.name=='{#NODENAME}')].membership.first()"
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 6h
        master_item:
          key: netapp.nodes.get
        tags:
        - tag: component
          value: node
        - tag: node
          value: "{#NODENAME}"
      - uuid: 5a7992c77854470ba367fc186d91ef0a
        name: "{#NODENAME}: State"
        type: DEPENDENT
        key: netapp.nodes.state[{#NODENAME}]
        value_type: CHAR
        description: |
          State of the node:
          up - Node is up and operational.
          booting - Node is booting up.
          down - Node has stopped or is dumping core.
          taken_over - Node has been taken over by its HA partner and is not yet waiting for giveback.
          waiting_for_giveback - Node has been taken over by its HA partner and is waiting for the HA partner to giveback disks.
          degraded - Node has one or more critical services offline.
          unknown - Node or its HA partner cannot be contacted and there is no information on the node's state.
        preprocessing:
        - type: JSONPATH
          parameters:
          - "$.records[?(@.name=='{#NODENAME}')].state.first()"
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 6h
        master_item:
          key: netapp.nodes.get
        tags:
        - tag: component
          value: node
        - tag: node
          value: "{#NODENAME}"
        trigger_prototypes:
        - uuid: 68f0b6495f934e37a531316884894a47
          expression: (last(/NetApp ONTAP Complete by HTTP/netapp.nodes.state[{#NODENAME}])<>"up")
          name: 'NetApp ONTAP: {#NODENAME}: Node state is abnormal'
          priority: AVERAGE
          description: |
            The state of the node is different from up:
            booting - Node is booting up.
            down - Node has stopped or is dumping core.
