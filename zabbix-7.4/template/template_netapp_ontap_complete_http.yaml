      authtype: BASIC
      username: "{$NETAPP.USERNAME}"
      password: "{$NETAPP.PASSWORD}"
      timeout: "{$NETAPP.HTTP.AGENT.TIMEOUT}"
      url: "{$NETAPP.URL}/api/storage/luns?fields=name,uuid,svm.name,space.size,space.used,status.state,status.container_state&max_records={$NETAPP.API.MAX.RECORDS}"
      tags:
