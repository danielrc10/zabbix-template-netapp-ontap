        name: 'Shelf {#SHELFNAME}: Disk count'
        type: DEPENDENT
        key: netapp.shelf.disk.count[{#SHELFUID}]
        preprocessing:
        - type: JSONPATH
          parameters:
          - "$.records[?(@.uid=='{#SHELFUID}')].disk_count.first()"
