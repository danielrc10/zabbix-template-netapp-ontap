          recovery_expression: last(/NetApp ONTAP Complete by HTTP/netapp.port.eth.state[{#NODENAME},{#ETHPORTNAME}])="up"
            or last(/NetApp ONTAP Complete by HTTP/netapp.port.eth.enabled[{#NODENAME},{#ETHPORTNAME}])=0
            or {$NETAPP.ETH.PORT.ALARM:"{#NODENAME}/{#ETHPORTNAME}"}=0
          event_name: 'NetApp ONTAP: Porta Ethernet {#NODENAME}/{#ETHPORTNAME} está
            inativa | valor no disparo: {ITEM.VALUE1}'
          opdata: 'Valor atual: {ITEM.LASTVALUE1}'
      - uuid: d1483267fb67438ebe2edf67c4a580fd
        name: "{#NODENAME} {#ETHPORTNAME}: Enabled"
        type: DEPENDENT
        key: netapp.port.eth.enabled[{#NODENAME},{#ETHPORTNAME}]
        preprocessing:
        - type: JSONPATH
          parameters:
          - "$.records[?(@.name=='{#ETHPORTNAME}'&&@.node.name=='{#NODENAME}')].enabled.first()"
        - type: JAVASCRIPT
          parameters:
          - 'return (value === ''true'' || value === ''1'') ? 1 : 0;'
        master_item:
          key: netapp.ports.eth.get
        tags:
        - tag: component
          value: interfaces
        - tag: interface
          value: "{#ETHPORTNAME}"
        - tag: node
          value: "{#NODENAME}"
      - uuid: 3b7e1b1ad7a941d99403ef6d4d25417e
        name: "{#NODENAME} {#ETHPORTNAME}: Effective speed"
        type: DEPENDENT
        key: netapp.port.eth.speed[{#NODENAME},{#ETHPORTNAME}]
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |
            var data = JSON.parse(value);
            var records = data.records || [];
            var targetNode = '{#NODENAME}';
            var targetName = '{#ETHPORTNAME}';

            function recordNodeName(record) {
              return record && record.node && record.node.name ? String(record.node.name) : '';
            }

            function findPort(reference, defaultNode) {
              if (!reference || !reference.name) return null;
              var name = String(reference.name);
              var node = reference.node && reference.node.name ? String(reference.node.name) : defaultNode;
              for (var i = 0; i < records.length; i++) {
                if (String(records[i].name || '') === name && recordNodeName(records[i]) === node) return records[i];
              }
              return null;
            }

            function capacity(port, visited) {
              if (!port) return 0;
              var identifier = recordNodeName(port) + '/' + String(port.name || '');
              if (visited[identifier]) return 0;
              visited[identifier] = true;

              var directSpeed = Number(port.speed || 0);
              if (directSpeed > 0) return directSpeed;

              if (port.type === 'lag' && port.lag) {
                var activePorts = port.lag.active_ports || [];
                var total = 0;
                for (var activeIndex = 0; activeIndex < activePorts.length; activeIndex++) {
                  total += capacity(findPort(activePorts[activeIndex], recordNodeName(port)), visited);
                }
                return total;
              }

              if (port.type === 'vlan' && port.vlan && port.vlan.base_port) {
                return capacity(findPort(port.vlan.base_port, recordNodeName(port)), visited);
              }

              return 0;
            }

            var target = findPort({name: targetName, node: {name: targetNode}}, targetNode);
            return capacity(target, {});
        master_item:
          key: netapp.ports.eth.get
        tags:
        - tag: component
          value: interfaces
        - tag: interface
          value: "{#ETHPORTNAME}"
        - tag: node
          value: "{#NODENAME}"
        units: Mbps
        description: Effective capacity in Mbps. Physical ports use speed; LAGs sum
          active member speeds; VLANs inherit their base-port capacity. Zero means
          that ONTAP did not provide enough capacity data.
      - uuid: 6b5e8e46209a4ba5971ca144ad2af85a
        name: "{#NODENAME} {#ETHPORTNAME}: Reachability"
        type: DEPENDENT
        key: netapp.port.eth.reachability[{#NODENAME},{#ETHPORTNAME}]
        preprocessing:
        - type: JSONPATH
          parameters:
          - "$.records[?(@.name=='{#ETHPORTNAME}'&&@.node.name=='{#NODENAME}')].reachability.first()"
        master_item:
          key: netapp.ports.eth.get
        tags:
        - tag: component
          value: interfaces
        - tag: interface
          value: "{#ETHPORTNAME}"
        - tag: node
          value: "{#NODENAME}"
        value_type: CHAR
        description: Diagnóstico de correspondência entre a topologia Layer 2 detectada
          e o broadcast domain configurado. Não representa diretamente o estado do
          link.
        trigger_prototypes:
        - uuid: f04022f14a664ec4846b9906c401e338
