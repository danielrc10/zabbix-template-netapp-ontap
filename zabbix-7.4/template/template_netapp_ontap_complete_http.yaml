            ONTAP Complete by HTTP/netapp.volume.state[{#VOLUMENAME}])<>"online")
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: (last(/NetApp ONTAP Complete by HTTP/netapp.volume.state[{#VOLUMENAME}],#1)<>last(/NetApp
            ONTAP Complete by HTTP/netapp.volume.state[{#VOLUMENAME}],#2) and last(/NetApp
            ONTAP Complete by HTTP/netapp.volume.state[{#VOLUMENAME}])="online")
          name: 'NetApp ONTAP: {#VOLUMENAME}: Volume state is abnormal'
          priority: AVERAGE
          description: A volume can only be brought online if it is offline. Taking
            a volume offline removes its junction path. The 'mixed' state applies
            to FlexGroup volumes only and cannot be specified as a target state. An
            'error' state implies that the volume is not in a state to serve data.
