    - macro: "{$NETAPP.AGGREGATE.USED.CRIT}"
      value: '90'
    - macro: "{$NETAPP.AGGREGATE.USED.RECOVERY}"
      value: '75'
    - macro: "{$NETAPP.AGGREGATE.USED.WARN}"
