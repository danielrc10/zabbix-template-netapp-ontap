    - macro: "{$NETAPP.ETH.PORT.ALARM}"
      value: '1'
      description: Default Ethernet alarm control. Set a contextual host macro such
        as {$NETAPP.ETH.PORT.ALARM:"node-01/e0c"}=0 to silence only that port.
    - macro: "{$NETAPP.ETH.PORT.ENABLED.MATCHES}"
      value: "^1$"
      description: Regex for administrative state in Ethernet discovery. Default discovers
        only ports with enabled=true.
    - macro: "{$NETAPP.ETH.PORT.MATCHES}"
      value: ".*"
      description: Regex of node/port identifiers included in Ethernet discovery.
    - macro: "{$NETAPP.ETH.PORT.NOT_MATCHES}"
      value: "^$"
      description: 'Regex of node/port identifiers excluded from Ethernet discovery;
        example: ^(node-01/e0c|node-02/e0d)$.'
    - macro: "{$NETAPP.FSA.DELAY}"
      value: 1h
    - macro: "{$NETAPP.FSA.DIRECTORY.DELAY}"
      value: 6h
      description: Interval for the recursive directory tree, which may require many
        API calls.
    - macro: "{$NETAPP.FSA.DIRECTORY.TIMEOUT}"
      value: 300s
      description: 'Zabbix Script timeout for recursive FSA collection (maximum supported:
        600s).'
    - macro: "{$NETAPP.FSA.INACTIVE.CRIT.DAYS}"
      value: '1095'
      description: High-severity threshold in days with neither data access nor data
        modification.
    - macro: "{$NETAPP.FSA.INACTIVE.WARN.DAYS}"
      value: '365'
      description: Warning threshold in days with neither data access nor data modification.
    - macro: "{$NETAPP.FSA.MAX.DEPTH}"
      value: '1'
      description: Maximum recursive directory depth. Root is 0; value 1 collects
        only the first-level person/project folders.
    - macro: "{$NETAPP.FSA.MAX.DIRECTORIES}"
      value: '5000'
      description: Safety cap for directories returned by one recursive collection.
    - macro: "{$NETAPP.FSA.MAX.RECORDS}"
      value: '200'
    - macro: "{$NETAPP.FSA.PAGE.SIZE}"
      value: '1000'
      description: Maximum records requested per ONTAP files API page.
    - macro: "{$NETAPP.FSA.TIMEOUT}"
      value: 60s
    - macro: "{$NETAPP.FSA.TOP.N}"
      value: '20'
    - macro: "{$NETAPP.FSA.VOLUME.MATCHES}"
      value: "^$"
      description: Regex of RW online volumes queried by FSA. Empty selection by default;
        configure it at host level before enabling FSA collection.
    - macro: "{$NETAPP.FSA.VOLUME.NOT_MATCHES}"
      value: "^$"
      description: Regex of volumes excluded from recursive FSA discovery.
    - macro: "{$NETAPP.HTTP.AGENT.TIMEOUT}"
      value: 15s
      description: The HTTP agent timeout to wait for a response from ONTAP.
    - macro: "{$NETAPP.PASSWORD}"
      description: ONTAP user password.
      type: SECRET_TEXT
    - macro: "{$NETAPP.PORT.UTIL.CRIT}"
      value: '85'
    - macro: "{$NETAPP.PORT.UTIL.RECOVERY}"
      value: '75'
    - macro: "{$NETAPP.QUOTA.DELAY}"
      value: 15m
      description: Interval for effective quota report collection.
    - macro: "{$NETAPP.QUOTA.MAX.RECORDS}"
      value: '5000'
      description: Maximum effective quota records requested in one REST response.
    - macro: "{$NETAPP.QUOTA.TIMEOUT}"
      value: 30s
      description: Timeout for quota report collection.
    - macro: "{$NETAPP.QUOTA.TYPE.MATCHES}"
      value: "^(user|group|tree)$"
      description: Effective quota types included in discovery.
    - macro: "{$NETAPP.QUOTA.USED.CRIT}"
      value: '90'
      description: High-severity percentage of a hard space or file quota.
    - macro: "{$NETAPP.QUOTA.USED.WARN}"
      value: '80'
      description: Warning percentage of a hard space or file quota.
    - macro: "{$NETAPP.QUOTA.VOLUME.MATCHES}"
      value: "^$"
      description: Regex of volume names whose effective quotas are discovered. Empty
        selection by default; configure it at host level.
    - macro: "{$NETAPP.QUOTA.VOLUME.NOT_MATCHES}"
      value: "^$"
      description: Regex of volume names excluded from effective quota discovery.
    - macro: "{$NETAPP.SHELF.TIMEOUT}"
      value: 30s
      description: Timeout for the heavier shelf/sensor collection.
    - macro: "{$NETAPP.SNAPMIRROR.LAG.CRIT}"
      value: '86400'
      description: Critical lag in seconds.
    - macro: "{$NETAPP.SNAPMIRROR.LAG.RECOVERY}"
      value: '43200'
      description: Recovery lag in seconds.
    - macro: "{$NETAPP.URL}"
      description: ONTAP cluster URL address.
    - macro: "{$NETAPP.USERNAME}"
      description: ONTAP user name.
    - macro: "{$NETAPP.VOLUME.USED.CRIT}"
      value: '90'
    - macro: "{$NETAPP.VOLUME.USED.RECOVERY}"
      value: '75'
    - macro: "{$NETAPP.VOLUME.USED.WARN}"
      value: '80'
